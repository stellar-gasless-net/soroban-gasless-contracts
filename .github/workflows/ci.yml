name: Soroban Contracts CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test Soroban Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for committed secrets or leftover local artifacts
        run: bash scripts/check-source-artifacts.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, pinned 2026-09-17
        with:
          targets: wasm32v1-none
      - name: Run Cargo Test
        run: cargo test --all
      # wasm32-unknown-unknown with a modern rustc emits non-MVP wasm encoding that this
      # repo's soroban-sdk 21.x-era host rejects at actual deploy/simulation time — `cargo
      # build`/`cargo test` alone can't catch this, since neither runs the compiled wasm
      # through a real Soroban host validator. wasm32v1-none forces MVP-compatible output.
      - name: Build WASM
        run: cargo build --target wasm32v1-none --release
